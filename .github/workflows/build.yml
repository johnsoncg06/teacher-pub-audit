name: 編譯桌面版

on:
  push:
    branches: [main]
  workflow_dispatch:

# 縮小體積：不再整包收集 pywebview，只帶本平台需要的視窗元件與鑰匙圈後端，並排除用不到的標準庫
env:
  COMMON_EXCLUDES: >-
    --exclude-module tkinter --exclude-module _tkinter --exclude-module unittest
    --exclude-module pydoc_data --exclude-module test --exclude-module lib2to3
    --exclude-module xmlrpc --exclude-module setuptools
    --exclude-module pip --exclude-module pkg_resources
    --exclude-module webview.platforms.qt --exclude-module webview.platforms.gtk
    --exclude-module webview.platforms.cef --exclude-module webview.platforms.android
    --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6
    --exclude-module qtpy --exclude-module gi --exclude-module cefpython3
    --exclude-module keyring.backends.SecretService --exclude-module keyring.backends.kwallet
    --exclude-module keyring.backends.libsecret --exclude-module secretstorage
    --exclude-module jeepney --exclude-module dbus

jobs:
  windows:
    name: Windows（安裝程式）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 自行編譯 PyInstaller 啟動程式（降低防毒誤判）
        shell: bash
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          V=$(python -c "import PyInstaller;print(PyInstaller.__version__)")
          pip install --force-reinstall --no-deps --no-binary pyinstaller "pyinstaller==$V"
          python -c "import PyInstaller,os;d=os.path.join(os.path.dirname(PyInstaller.__file__),'bootloader','Windows-64bit-intel');print(os.listdir(d))"
      - name: 基本檢查
        run: python -c "import main; print(main.Api().info()); print(main.Api().key_status())"
      - name: 打包（資料夾模式）
        shell: bash
        run: >-
          pyinstaller --noconfirm --onedir --windowed --name TeacherPubAudit --icon icon.ico
          --version-file version_info.txt
          --add-data "app.html;."
          --collect-data webview
          --hidden-import webview.platforms.winforms --hidden-import webview.platforms.edgechromium
          --hidden-import clr --hidden-import keyring.backends.Windows
          --exclude-module webview.platforms.cocoa --exclude-module keyring.backends.macOS
          $COMMON_EXCLUDES main.py
      - name: 自我檢查（元件、鑰匙圈、HTTPS）
        shell: pwsh
        run: |
          $p = Start-Process dist/TeacherPubAudit/TeacherPubAudit.exe -ArgumentList "--selftest","selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "自我檢查失敗" }
      - name: 自我檢查（實際開啟視窗）
        shell: pwsh
        run: |
          $p = Start-Process dist/TeacherPubAudit/TeacherPubAudit.exe -ArgumentList "--selftest-gui","gui.json" -Wait -PassThru
          Get-Content gui.json
          if ($p.ExitCode -ne 0) { throw "視窗自我檢查失敗" }
      - name: 製作安裝程式
        shell: pwsh
        run: |
          $lang = "$PWD\ChineseTraditional.isl"
          try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseTraditional.isl" -OutFile $lang } catch { }
          if (-not (Test-Path $lang)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $lang)) { $lang = "compiler:Default.isl" }
          & $iscc "/DLangFile=$lang" setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 失敗" }
          Copy-Item out/TeacherPubAudit_Setup.exe "out/教師論文盤點工具_安裝程式.exe"
          Remove-Item out/TeacherPubAudit_Setup.exe
          Get-ChildItem out | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,2)}}
      - name: Windows Defender 掃描
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "此編譯機沒有 Defender"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          & $mp -GetFiles 2>$null | Out-Null
          Get-MpComputerStatus | Select-Object AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List | Out-Host
          $bad = 0
          foreach ($f in @("dist\TeacherPubAudit\TeacherPubAudit.exe", "out\教師論文盤點工具_安裝程式.exe")) {
            $full = (Resolve-Path $f).Path
            & $mp -Scan -ScanType 3 -File $full -DisableRemediation | Out-Host
            Write-Host "$f => exit $LASTEXITCODE"
            if ($LASTEXITCODE -eq 2) { $bad = 1 }
          }
          Get-MpThreatDetection | Format-List | Out-Host
          if ($bad) { throw "Defender 偵測到威脅" }
      - uses: actions/upload-artifact@v4
        with:
          name: TeacherPubAudit-Windows
          path: out/*.exe

  macos:
    name: macOS (.dmg) ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: AppleSilicon
          - os: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'Intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 基本檢查
        run: python -c "import main; print(main.Api().info())"
      - name: 打包
        run: >-
          pyinstaller --noconfirm --windowed --name TeacherPubAudit --icon icon.icns
          --osx-bundle-identifier tw.edu.cmu.teacherpubaudit
          --add-data "app.html:."
          --collect-data webview
          --hidden-import webview.platforms.cocoa --hidden-import keyring.backends.macOS
          --exclude-module webview.platforms.winforms --exclude-module webview.platforms.edgechromium
          --exclude-module webview.platforms.mshtml --exclude-module clr --exclude-module pythonnet
          --exclude-module clr_loader --exclude-module keyring.backends.Windows
          $COMMON_EXCLUDES main.py
      - name: 移除 Windows 專用檔案
        run: |
          APP="dist/TeacherPubAudit.app"
          find "$APP" \( -name "*.dll" -o -name "*.exe" -o -name "*.pdb" \) -print -delete
          find "$APP" -type d -empty -delete || true
      - name: 設定顯示名稱
        run: |
          APP="dist/TeacherPubAudit.app"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 教師論文盤點工具" "$APP/Contents/Info.plist" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 教師論文盤點工具" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 教師論文盤點工具" "$APP/Contents/Info.plist" || true
          codesign --force --deep --sign - "$APP"
      - name: 自我檢查（元件、HTTPS）
        run: |
          dist/TeacherPubAudit.app/Contents/MacOS/TeacherPubAudit --selftest "$PWD/selftest.json"; rc=$?
          cat selftest.json; exit $rc
      - name: 自我檢查（實際開啟視窗）
        run: |
          dist/TeacherPubAudit.app/Contents/MacOS/TeacherPubAudit --selftest-gui "$PWD/gui.json"; rc=$?
          cat gui.json || true; exit $rc
      - name: 體積
        run: |
          du -sh dist/TeacherPubAudit.app
          find dist/TeacherPubAudit.app -type f -size +300k -exec du -k {} + | sort -rn | head -20
      - name: 製作 DMG
        run: |
          mkdir -p dmg out
          cp -R "dist/TeacherPubAudit.app" "dmg/教師論文盤點工具.app"
          ln -s /Applications dmg/Applications
          for i in 1 2 3 4 5; do
            hdiutil create -volname "教師論文盤點工具" -srcfolder dmg -ov -format ULMO "out/教師論文盤點工具_Mac_${{ matrix.arch }}.dmg" && break
            echo "hdiutil 忙碌，第 $i 次重試"; sleep 10
          done
          test -f "out/教師論文盤點工具_Mac_${{ matrix.arch }}.dmg"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: TeacherPubAudit-macOS-${{ matrix.arch }}
          path: out/*.dmg
